[project]
name = "sellvion-agentic-backend"
version = "2.0.0"
description = "SELLVION Python 3.12+ FastAPI + LangGraph + LangChain + Google Gemini Multi-Agent Backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.163.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.3",
  "python-dotenv==1.2.4",
  "langgraph==1.2.22",
  "langgraph-checkpoint==4.3.2",
  "langgraph-checkpoint-sqlite==3.1.3",
  "langgraph-checkpoint-postgres==3.2.1",
  "langchain==1.5.0",
  "langchain-core==1.8.0",
  "langchain-google-genai==4.5.0",
  "langsmith==0.14.17",
  "psycopg[binary]==3.3.9",
  "pgvector==0.5.1",
  "redis==8.1.0",
  "httpx==0.28.1",
  "tenacity==9.1.4",
  "aiosqlite==0.22.1",
]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
pythonpath = ["."]
